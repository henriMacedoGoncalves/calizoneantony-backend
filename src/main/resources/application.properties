spring.application.name=Calizone-Antony

spring.datasource.url=jdbc:postgresql://localhost:5432/calizoneantony
spring.datasource.username=calizoneantony
spring.datasource.password=calizoneantony
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.rest.base-path=/api

allowed.origins=http://localhost:4200

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://calizone-antony-dev.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audience=api://calizone-antony